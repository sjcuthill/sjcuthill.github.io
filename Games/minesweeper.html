<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="icon" type="image/png" href="../Favicon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #f3f3f3; }
        header { width: 100%; padding: 16px; background: #8E3333; color: white; text-align: center; }
        .board { display: grid; gap: 4px; background: #ddd; padding: 8px; border-radius: 8px; margin-top: 20px; }
        .cell { width: 32px; height: 32px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; font-weight: 600; }
        .cell.revealed { background: #eaeaea; cursor: default; }
        .panel { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
        button { background: #8E3333; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .navlinks { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px; margin-top: 8px; }
        .navlinks a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
        .navlinks a:hover { text-decoration: underline; opacity: 1; }
    </style>
</head>
<body>
    <header>
        <h2>Minesweeper</h2>
        <nav class="navlinks">
            <a href="games.html">← Back to Games</a>
            <a href="../index.html">← Back to Portfolio</a>
        </nav>
    </header>
    <div class="panel">
        <span>16x16 • 40 mines</span>
        <button id="reset">Reset</button>
    </div>
    <div id="board" class="board"></div>
    <script>
        const rows = 16, cols = 16, minesCount = 40;
        let board, mineSet, revealedCount, gameOver, minesPlaced;

        const boardEl = document.getElementById('board');
        const resetBtn = document.getElementById('reset');
        boardEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;

        function init() {
            board = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({
                mine: false, adj: 0, el: null, revealed: false, flagged: false
            })));
            mineSet = new Set();
            revealedCount = 0;
            gameOver = false;
            minesPlaced = false;
            boardEl.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.addEventListener('click', () => onReveal(r, c));
                    div.addEventListener('contextmenu', (e) => { e.preventDefault(); onFlag(r, c); });
                    board[r][c].el = div;
                    boardEl.appendChild(div);
                }
            }
        }

        function neighbors(r, c) {
            const res = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) res.push([nr, nc]);
                }
            }
            return res;
        }

        // First click is always a blank (0) — keep that cell and its neighbors mine-free
        function placeMines(safeR, safeC) {
            const forbidden = new Set([`${safeR},${safeC}`]);
            neighbors(safeR, safeC).forEach(([nr, nc]) => forbidden.add(`${nr},${nc}`));

            mineSet = new Set();
            while (mineSet.size < minesCount) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);
                const key = `${r},${c}`;
                if (forbidden.has(key) || mineSet.has(key)) continue;
                mineSet.add(key);
                board[r][c].mine = true;
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) {
                        board[r][c].adj = 0;
                        continue;
                    }
                    board[r][c].adj = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
                }
            }
            minesPlaced = true;
        }

        function onReveal(r, c) {
            if (gameOver) return;
            const cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            if (!minesPlaced) placeMines(r, c);

            cell.revealed = true;
            cell.el.classList.add('revealed');
            if (cell.mine) {
                cell.el.textContent = '💣';
                endGame(false);
                return;
            }
            revealedCount++;
            if (cell.adj > 0) {
                cell.el.textContent = cell.adj;
            } else {
                neighbors(r, c).forEach(([nr, nc]) => {
                    if (!board[nr][nc].revealed) onReveal(nr, nc);
                });
            }
            checkWin();
        }

        function onFlag(r, c) {
            if (gameOver || !minesPlaced) return;
            const cell = board[r][c];
            if (cell.revealed) return;
            cell.flagged = !cell.flagged;
            cell.el.textContent = cell.flagged ? '🚩' : '';
        }

        function endGame(win) {
            gameOver = true;
            board.flat().forEach((cell) => {
                if (cell.mine) {
                    cell.el.textContent = '💣';
                    cell.el.classList.add('revealed');
                }
            });
            setTimeout(() => alert(win ? 'You win! 🎉' : 'Boom! 💥'), 50);
        }

        function checkWin() {
            if (revealedCount === rows * cols - minesCount) endGame(true);
        }

        resetBtn.addEventListener('click', init);
        init();
    </script>
</body>
</html>
