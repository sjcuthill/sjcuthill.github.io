<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="icon" type="image/png" href="../Favicon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #E0E0E0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .red-band {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background: #8E3333;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            width: 100%;
            padding: 40px 20px;
        }
        .header {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 20;
        }
        .nav-links {
            display: flex;
            flex-direction: row;
            gap: 15px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            text-align: center;
            min-width: 100px;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 768px) {
            .header { top: 15px; right: 15px; }
            .nav-links { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
            .nav-links a { padding: 8px 12px; font-size: 0.85rem; min-width: 80px; }
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #231C07;
            text-align: center;
            margin-bottom: 24px;
        }
        .subtitle {
            text-align: center;
            margin-bottom: 32px;
            color: #231C07;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(35,28,7,0.2);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: #231C07;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .card h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 8px 0;
        }
        .back {
            display: inline-block;
            margin-top: 28px;
            text-decoration: none;
            color: #231C07;
            border: 1px solid rgba(35,28,7,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.8);
        }
    </style>
    </head>
    <body>
        <div class="red-band"></div>
        <header class="header">
            <nav class="nav-links">
                <a href="../">Home</a>
                <a href="../About/about.html">About</a>
                <a href="../Resume/resume.html">Resume</a>
                <a href="../Projects/projects.html">Projects</a>
            </nav>
        </header>
        <div class="container">
            <h1 class="title">Pick a Game</h1>
            <p class="subtitle">A few quick distractions—have fun!</p>
            <div class="grid">
                <a class="card" href="minesweeper.html">
                    <h3>Minesweeper</h3>
                    <p>Classic logic puzzle. Clear the board without hitting a mine.</p>
                </a>
                <a class="card" href="wordle.html">
                    <h3>Wordle</h3>
                    <p>Guess the 5-letter word in 6 tries.</p>
                </a>
                <a class="card" href="snake.html">
                    <h3>Snake</h3>
                    <p>Eat the food, grow the snake, avoid the walls.</p>
                </a>
            </div>
            <a class="back" href="../">← Back to Portfolio</a>
        </div>
    </body>
    </html>
