<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="icon" type="image/png" href="../Favicon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #8E3333;
            --ink: #1a1612;
            --muted: #5c564c;
            --line: rgba(26, 22, 18, 0.12);
            --white: #ffffff;
            --gray: #f0efed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--white);
            color: var(--ink);
        }

        .site-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 18px 28px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }

        .site-nav a {
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
            padding: 8px 14px;
            border: 1px solid transparent;
        }

        .site-nav a:hover {
            color: var(--red);
            border-color: rgba(142, 51, 51, 0.35);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 56px clamp(20px, 4vw, 40px) 80px;
        }

        .eyebrow {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 14px;
            text-align: center;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--gray);
            border: 1px solid var(--line);
            padding: 28px 24px;
            text-decoration: none;
            color: var(--ink);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(142, 51, 51, 0.35);
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        .card p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .back {
            display: inline-block;
            margin-top: 36px;
            text-decoration: none;
            color: var(--red);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .site-nav {
                justify-content: center;
                flex-wrap: wrap;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="../index.html">Home</a>
        <a href="../About/about.html">About</a>
        <a href="../Resume/resume.html">Resume</a>
        <a href="../Projects/projects.html">Projects</a>
    </nav>
    <div class="container">
        <p class="eyebrow">Distractions</p>
        <h1 class="title">Pick a Game</h1>
        <p class="subtitle">A few quick distractions—have fun!</p>
        <div class="grid">
            <a class="card" href="minesweeper.html">
                <h3>Minesweeper</h3>
                <p>Classic logic puzzle. Clear the board without hitting a mine.</p>
            </a>
            <a class="card" href="wordle.html">
                <h3>Wordle</h3>
                <p>Guess the 5-letter word in 6 tries.</p>
            </a>
            <a class="card" href="snake.html">
                <h3>Snake</h3>
                <p>Eat the food, grow the snake, avoid the walls.</p>
            </a>
        </div>
        <a class="back" href="../index.html">← Back to Portfolio</a>
    </div>
</body>
</html>
