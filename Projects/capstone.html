    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; position: relative; color: #231C07; background: #E0E0E0; }
        .red-band { position: absolute; top: 0; left: 0; width: 100%; height: 40vh; background: #8E3333; z-index: 0; }
        .content-container { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
        .header { position: absolute; top: 30px; right: 30px; z-index: 20; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 25px; transition: all 0.3s ease; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.35); backdrop-filter: blur(10px); text-align: center; min-width: 100px; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.6); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); }
        .page { flex: 1; padding: calc(40vh + 40px) 24px 60px 24px; display: flex; justify-content: center; }
        .article { max-width: 800px; width: 100%; background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); padding: 40px 42px; }
        .back { display: inline-block; margin-bottom: 18px; color: #8E3333; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 8px; }
        .meta { color: #8E3333; font-weight: 500; margin-bottom: 22px; }
        p { font-size: 1.02rem; line-height: 1.7; }
        @media (max-width: 768px) {
            .header { top: 15px; right: 15px; }
            .nav-links { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
            .nav-links a { padding: 8px 12px; font-size: 0.85rem; min-width: 80px; }
            .page { padding: calc(40vh + 24px) 16px 24px 16px; }
            .article { padding: 24px 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
