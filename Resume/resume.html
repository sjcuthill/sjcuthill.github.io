<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sierra Cuthill - Resume</title>
    <link rel="icon" type="image/png" href="../Favicon.png">
    <link rel="shortcut icon" type="image/png" href="../Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #8E3333;
            --ink: #1a1612;
            --muted: #5c564c;
            --line: rgba(26, 22, 18, 0.12);
            --white: #ffffff;
            --gray: #f0efed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: var(--ink);
            background: var(--white);
            padding-bottom: 80px;
        }

        .site-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 18px 28px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }

        .site-nav a {
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
            padding: 8px 14px;
            border: 1px solid transparent;
        }

        .site-nav a:hover,
        .site-nav a.active {
            color: var(--red);
            border-color: rgba(142, 51, 51, 0.35);
        }

        .page-head {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px clamp(24px, 5vw, 48px) 24px;
        }

        .eyebrow {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 14px;
        }

        .page-head h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        .resume-content {
            display: flex;
            justify-content: center;
            padding: 12px clamp(24px, 5vw, 48px) 24px;
        }

        .resume-container {
            background: var(--gray);
            border: 1px solid var(--line);
            padding: 28px;
            max-width: 720px;
            width: 100%;
        }

        .resume-image {
            width: 100%;
            height: auto;
            display: block;
            background: var(--white);
        }

        .download-section {
            text-align: center;
            padding: 12px 24px 40px;
        }

        .download-button {
            display: inline-block;
            background: transparent;
            color: var(--red);
            padding: 12px 22px;
            text-decoration: none;
            border: 1px solid rgba(142, 51, 51, 0.4);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .download-button:hover {
            background: var(--red);
            color: var(--white);
        }

        .section-foot {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 70;
        }

        .section-foot a {
            color: var(--red);
            background: rgba(255,255,255,0.92);
            padding: 5px 10px;
            text-decoration: none;
            border: 1px solid var(--line);
            font-size: 0.72rem;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .site-nav {
                justify-content: center;
                flex-wrap: wrap;
                padding: 12px 14px;
            }
            .resume-container { padding: 16px; }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="../index.html">Home</a>
        <a href="../About/about.html">About</a>
        <a href="resume.html" class="active">Resume</a>
        <a href="../Projects/projects.html">Projects</a>
    </nav>

    <header class="page-head">
        <p class="eyebrow">Curriculum Vitae</p>
        <h1>Resume</h1>
    </header>

    <main class="resume-content">
        <div class="resume-container">
            <img src="portfolio resume.jpg" alt="Sierra Cuthill Resume" class="resume-image">
        </div>
    </main>

    <div class="download-section">
        <a href="Sierra Cuthill Resume.pdf" class="download-button" download="Sierra_Cuthill_Resume.pdf">Download PDF</a>
    </div>

    <footer class="section-foot">
        <a href="../Games/games.html">Bored? Here's something to distract you from this super interesting portfolio.</a>
    </footer>
</body>
</html>
